# Production compose — uses pre-built images from GHCR
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Required env vars (set in .env or export):
#   GHCR_OWNER          — GitHub org/user (default: pimabill)
#   JWT_SECRET           — JWT signing secret
#   JWT_REFRESH_SECRET   — JWT refresh signing secret
#   ENCRYPTION_KEY       — 64-char hex key for encrypting provider credentials

services:
  # ─── Infrastructure ────────────────────────────────────────────

  central-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: central
      POSTGRES_USER: central
      POSTGRES_PASSWORD: ${CENTRAL_DB_PASSWORD:?Set CENTRAL_DB_PASSWORD in .env}
    volumes:
      - central_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  internal-tenant-db:
    image: postgres:15-alpine
    # Every organisation's database lives here, and each API/worker process keeps a small pool per organisation.
    command: postgres -c max_connections=${TENANT_DB_MAX_CONNECTIONS:-300}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TENANT_DB_PASSWORD:?Set TENANT_DB_PASSWORD in .env}
    volumes:
      - internal_tenant_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Backend API ───────────────────────────────────────────────

  api:
    image: ghcr.io/${GHCR_OWNER:-pimabill}/api:latest
    environment:
      NODE_ENV: production
      PORT: 4000
      API_BASE_URL: ${API_URL:-http://localhost:4000}
      CENTRAL_DATABASE_URL: postgresql://central:${CENTRAL_DB_PASSWORD:?Set CENTRAL_DB_PASSWORD in .env}@central-db:5432/central
      INTERNAL_POSTGRES_URL: postgresql://postgres:${TENANT_DB_PASSWORD:?Set TENANT_DB_PASSWORD in .env}@internal-tenant-db:5432/postgres
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_SLUG: ${BRAND_SLUG:-}
      BRAND_SUPPORT_EMAIL: ${BRAND_SUPPORT_EMAIL:-}
      BRAND_WEBSITE: ${BRAND_WEBSITE:-}
      PLATFORM_ADMIN_TENANT_IDS: ${PLATFORM_ADMIN_TENANT_IDS:-}
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:-}
      MANAGED_PAYMENTS_URL: ${MANAGED_PAYMENTS_URL:-}
      MANAGED_PAYMENTS_API_KEY: ${MANAGED_PAYMENTS_API_KEY:-}
      MANAGED_PAYMENTS_WEBHOOK_SECRET: ${MANAGED_PAYMENTS_WEBHOOK_SECRET:-}
      LEDGER_MODE: ${LEDGER_MODE:-shadow}
      JWT_EXPIRATION: 1h
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env (openssl rand -hex 32)}
      JWT_REFRESH_EXPIRATION: 7d
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@novabilling.one}
      PDF_STORAGE_PATH: /app/uploads/invoices
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:4002}
      CORS_ORIGINS: ${LANDING_URL:-http://localhost:4001},${DASHBOARD_URL:-http://localhost:4002}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      central-db:
        condition: service_healthy
      internal-tenant-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  # BullMQ Worker
  worker:
    image: ghcr.io/${GHCR_OWNER:-pimabill}/api:latest
    environment:
      NODE_ENV: production
      API_BASE_URL: ${API_URL:-http://localhost:4000}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:4002}
      PDF_STORAGE_PATH: /app/uploads/invoices
      CENTRAL_DATABASE_URL: postgresql://central:${CENTRAL_DB_PASSWORD:?Set CENTRAL_DB_PASSWORD in .env}@central-db:5432/central
      INTERNAL_POSTGRES_URL: postgresql://postgres:${TENANT_DB_PASSWORD:?Set TENANT_DB_PASSWORD in .env}@internal-tenant-db:5432/postgres
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_SLUG: ${BRAND_SLUG:-}
      BRAND_SUPPORT_EMAIL: ${BRAND_SUPPORT_EMAIL:-}
      BRAND_WEBSITE: ${BRAND_WEBSITE:-}
      PLATFORM_ADMIN_TENANT_IDS: ${PLATFORM_ADMIN_TENANT_IDS:-}
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:-}
      MANAGED_PAYMENTS_URL: ${MANAGED_PAYMENTS_URL:-}
      MANAGED_PAYMENTS_API_KEY: ${MANAGED_PAYMENTS_API_KEY:-}
      MANAGED_PAYMENTS_WEBHOOK_SECRET: ${MANAGED_PAYMENTS_WEBHOOK_SECRET:-}
      LEDGER_MODE: ${LEDGER_MODE:-shadow}
      JWT_EXPIRATION: 1h
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env (openssl rand -hex 32)}
      JWT_REFRESH_EXPIRATION: 7d
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@novabilling.one}
    command: node dist/main
    volumes:
      - uploads:/app/uploads
    depends_on:
      central-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
    restart: unless-stopped

  # ─── Frontend Apps ─────────────────────────────────────────────

  landing:
    image: ghcr.io/${GHCR_OWNER:-pimabill}/landing:latest
    ports:
      - "${LANDING_PORT:-4001}:4001"
    environment:
      NODE_ENV: production
    depends_on:
      - api
    restart: unless-stopped

  dashboard:
    image: ghcr.io/${GHCR_OWNER:-pimabill}/dashboard:latest
    ports:
      - "${DASHBOARD_PORT:-4002}:4002"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://api:4000
    depends_on:
      - api
    restart: unless-stopped

  # ─── Documentation ─────────────────────────────────────────────

  docs:
    image: ghcr.io/${GHCR_OWNER:-pimabill}/docs:latest
    ports:
      - "${DOCS_PORT:-4003}:4003"
    restart: unless-stopped

volumes:
  central_db_data:
  internal_tenant_db_data:
  redis_data:
  uploads:
