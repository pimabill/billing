name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

# Least privilege: jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Run tests first
  # ──────────────────────────────────────────────
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma clients
        run: |
          npx prisma generate --schema=./prisma/schema-central.prisma
          npx prisma generate --schema=./prisma/schema-tenant.prisma

      - run: npx jest test/unit --no-coverage --forceExit

  # ──────────────────────────────────────────────
  # Build and push Docker images to GHCR
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: dashboard
            context: ./dashboard
            dockerfile: ./dashboard/Dockerfile
          - service: landing
            context: ./landing
            dockerfile: ./landing/Dockerfile
          - service: docs
            context: ./docs
            dockerfile: ./docs/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_DASHBOARD_URL=${{ vars.DASHBOARD_URL || 'http://localhost:4002' }}
            NEXT_PUBLIC_DOCS_URL=${{ vars.DOCS_URL || 'http://localhost:4003' }}
            NEXT_PUBLIC_API_REF_URL=${{ vars.API_URL || 'http://localhost:4000' }}/api/reference
            LANDING_URL=${{ vars.LANDING_URL || 'http://localhost:4001' }}
            DASHBOARD_URL=${{ vars.DASHBOARD_URL || 'http://localhost:4002' }}
            API_REF_URL=${{ vars.API_URL || 'http://localhost:4000' }}/api/reference
            NEXT_PUBLIC_BRAND_NAME=${{ vars.BRAND_NAME || '' }}
            NEXT_PUBLIC_BRAND_LOGO=${{ vars.BRAND_LOGO || '' }}
            NEXT_PUBLIC_BRAND_TAGLINE=${{ vars.BRAND_TAGLINE || '' }}
            NEXT_PUBLIC_BRAND_PRIMARY=${{ vars.BRAND_PRIMARY || '' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.LANDING_URL || '' }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.CONTACT_EMAIL || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Deploy to server via SSH
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: production
    steps:
      - uses: actions/checkout@v4

      # The server folder is not a git checkout, so ship the compose file with each deploy.
      - name: Copy compose file
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /tmp/pimabill-deploy
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '~/novabilling' }}

            # Keep the previous compose file, then use the one from this commit
            [ -f docker-compose.prod.yml ] && cp docker-compose.prod.yml docker-compose.prod.yml.bak
            mv /tmp/pimabill-deploy/docker-compose.prod.yml docker-compose.prod.yml

            # Pull images from this repo's owner, whatever .env says
            export GHCR_OWNER=${{ github.repository_owner }}

            # Log in to GHCR
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull new images
            docker compose -f docker-compose.prod.yml pull

            # Restart with new images (zero-downtime for stateless services)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # The API migrates before it starts; wait for it to answer, and show its log either way.
            healthy=
            for i in $(seq 1 36); do
              if docker compose -f docker-compose.prod.yml exec -T api node -e "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null; then healthy=1; break; fi
              sleep 5
            done
            echo "--- API log (last 60 lines)"
            docker compose -f docker-compose.prod.yml logs --no-color --tail 60 api
            if [ -z "$healthy" ]; then echo "API did not become healthy within 3 minutes"; exit 1; fi

            # Other stacks on this host (a sandbox, another domain) run the same
            # images. Each has a .follow-deploy file naming its compose project;
            # update its API, workers and dashboard too.
            for marker in ~/*/.follow-deploy; do
              [ -f "$marker" ] || continue
              dir=$(dirname "$marker"); project=$(cat "$marker")
              cp docker-compose.prod.yml "$dir/docker-compose.prod.yml"
              (cd "$dir" && docker compose -p "$project" -f docker-compose.prod.yml up -d api worker dashboard) || echo "Could not update $project"
            done

            # Clean up old images
            docker image prune -f

            echo "Deployed successfully at $(date)"