apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Override image tags for production
images:
  - name: ghcr.io/pimabill/api
    newTag: v1.0.0
  - name: ghcr.io/pimabill/dashboard
    newTag: v1.0.0
  - name: ghcr.io/pimabill/landing
    newTag: v1.0.0
  - name: ghcr.io/pimabill/docs
    newTag: v1.0.0

# Patch replicas for production scale
patches:
  - target:
      kind: Deployment
      name: api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: worker
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Ingress
      name: novabilling
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: api.pimabill.com
      - op: replace
        path: /spec/rules/1/host
        value: app.pimabill.com
      - op: replace
        path: /spec/rules/2/host
        value: pimabill.com
      - op: replace
        path: /spec/rules/3/host
        value: docs.pimabill.com
